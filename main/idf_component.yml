## 本组件清单
## 共享自定义组件库通过 EXTRA_COMPONENT_DIRS 挂载（见项目根 CMakeLists.txt），
## 此清单只声明版本约束，不写路径。

## 版本约束
dependencies:
  wifi_manager:
    version: ">=1.1.0"

## 构建规则（2026-10-03）
rules:
  ## 来自 EXTRA_COMPONENT_DIRS 的共享组件，由 CMake 自动发现，无需在此列举路径
  ## ESP-IDF v6.1 不再支持旧的 'path:' 字段写法，必须写清规则
  ## 参考：https://docs.espressif.com/projects/esp-idf/en/v6.1/esp-idf/components.html
  # 声明这些组件为本地组件（非托管），让 idf_component_manager 跳过版本校验
  wifi_manager:
    ## 标记为本地目录组件，IDF 会在 EXTRA_COMPONENT_DIRS 里寻找
    is_local: true
  oled:
    is_local: true
  font_service:
    is_local: true